# Unsample Local Development Stack
#
# Provides a complete local observability stack:
#   - OTel Collector (receives traces, routes debug vs production)
#   - Grafana Tempo (trace storage backend)
#   - Grafana (trace viewer, reads from Tempo)
#
# Usage:
#   docker-compose up        Start all services
#   docker-compose down -v   Stop and remove volumes
#
# Ports:
#   4317  - OTLP gRPC (Collector)
#   4318  - OTLP HTTP (Collector)
#   3000  - Grafana UI (trace viewer)
#   3200  - Tempo HTTP API (trace polling)

services:
  # --- OTel Collector ---
  # Uses contrib image which includes the routing connector for
  # attribute-based span routing (debug vs production).
  # When building for production, replace with the custom binary
  # built by scripts/build-collector.sh.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  # --- Grafana Tempo ---
  # Trace storage backend. Receives traces from the Collector via OTLP.
  # In production, you'd have separate debug (7-day TTL) and production
  # (2-day TTL) Tempo instances. For local dev, we use a single instance.
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (trace polling)
    restart: unless-stopped

  # --- Grafana ---
  # Trace viewer with pre-provisioned Tempo datasource.
  # No login required (anonymous access enabled for local dev).
  # View traces at: http://localhost:3000/explore
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

volumes:
  tempo-data:
