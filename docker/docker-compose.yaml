# Unsample Local Development Stack
#
# Provides a complete local observability stack:
#   - OTel Collector (receives traces, routes debug vs production)
#   - Grafana Tempo (trace storage backend)
#   - Jaeger UI (trace viewer, reads from Tempo)
#
# Usage:
#   docker-compose up        Start all services
#   docker-compose down -v   Stop and remove volumes
#
# Ports:
#   4317  - OTLP gRPC (Collector)
#   4318  - OTLP HTTP (Collector)
#   16686 - Jaeger UI
#   3200  - Tempo HTTP API (trace polling)

services:
  # --- OTel Collector ---
  # Uses contrib image which includes the routing connector for
  # attribute-based span routing (debug vs production).
  # When building for production, replace with the custom binary
  # built by scripts/build-collector.sh.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  # --- Grafana Tempo ---
  # Trace storage backend. Receives traces from the Collector via OTLP.
  # In production, you'd have separate debug (7-day TTL) and production
  # (2-day TTL) Tempo instances. For local dev, we use a single instance.
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (trace polling)
    restart: unless-stopped

  # --- Jaeger UI ---
  # Trace viewer connected to Tempo via the Jaeger gRPC query API.
  # Provides the UI for viewing debug traces at http://localhost:16686.
  jaeger-ui:
    image: jaegertracing/jaeger-query:1.62.0
    environment:
      - GRPC_STORAGE_SERVER=tempo:9096
      - SPAN_STORAGE_TYPE=grpc
    ports:
      - "16686:16686"  # Jaeger UI
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

volumes:
  tempo-data:
